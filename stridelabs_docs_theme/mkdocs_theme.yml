# Defaults every StrideLabs docs site inherits. Consuming repos override any
# of these in their own zensical.toml — this file only sets the starting point.
#
# `extends: material` means "build on Zensical's own theme", which resolves to
# the "modern" variant. Set `variant = "classic"` in a consumer to get the
# older Material for MkDocs look instead.
extends: material

# --- type stack, from stridelabs.ai --------------------------------------
font:
  text: Inter
  code: JetBrains Mono

# --- colour schemes -------------------------------------------------------
# IMPORTANT: these use the stock scheme names "default" and "slate", not
# custom names. The stylesheet layers StrideLabs tokens ON TOP of them.
#
# Do not rename these. Zensical defines 14 --md-code-hl-* syntax-highlight
# variables under [data-md-color-scheme=slate] and zero under "default"; a
# custom scheme name silently orphans all 14, and dark mode ends up rendering
# light-mode syntax colours on a dark ground — unreadable code blocks that
# still build clean.
palette:
  - media: "(prefers-color-scheme: light)"
    scheme: default
    toggle:
      icon: lucide/sun
      name: Switch to dark mode
  - media: "(prefers-color-scheme: dark)"
    scheme: slate
    toggle:
      icon: lucide/moon
      name: Switch to light mode

# --- feature toggles ------------------------------------------------------
features:
  - content.code.annotate
  - content.code.copy
  - content.tabs.link
  - navigation.expand
  - navigation.footer
  - navigation.sections
  - navigation.top
  - search.highlight
  - search.share
